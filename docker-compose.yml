# Chạy game + máy chủ trên VPS, có HTTPS tự động (cần thiết để cài game lên điện thoại).
# 1) Trỏ tên miền (vd. game.tenmien.com) về IP máy chủ
# 2) Sửa DOMAIN bên dưới, rồi chạy:  docker compose up -d --build
services:
  game:
    build: .
    restart: unless-stopped
    environment:
      - PORT=8787
      - DATA_DIR=/data
      - ADMIN_PASSWORD=doi-mat-khau-nay   # ← mật khẩu trang quản trị /admin (đặt thật khó đoán)
      - BACKUP_HOURS=24                   # sao lưu mỗi 24 giờ
      - BACKUP_KEEP=14                    # giữ 14 bản gần nhất
    volumes:
      - kng-data:/data          # tài khoản + bản lưu (giữ lại khi cập nhật)
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      - DOMAIN=game.tenmien.com # ← đổi thành tên miền của anh
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [game]
volumes:
  kng-data:
  caddy-data:
